name: Prepare iPhone app icons
on:
  push:
    paths:
      - '.github/workflows/prepare-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create standard-size icons from original artwork
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          im = Image.open('827EA6B6-5688-47B1-BDEC-E5B1109A1052.png').convert('RGB')
          for size, name in [(180,'apple-touch-icon-180.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              im.resize((size,size),Image.Resampling.LANCZOS).save(name,'PNG',optimize=True)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon-180.png icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Generate iOS-ready icon sizes" && git push)
