<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f0e9"><title>My Perfume Wardrobe</title><link rel="icon" type="image/png" href="/perfume-wardrobe/827EA6B6-5688-47B1-BDEC-E5B1109A1052.png"><link rel="apple-touch-icon" sizes="180x180" href="/perfume-wardrobe/827EA6B6-5688-47B1-BDEC-E5B1109A1052.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Perfume Wardrobe"><style>
:root{--ink:#3b3431;--muted:#81766f;--bg:#f6f0e9;--paper:#fffdf9;--line:#e8ddd3;--accent:#866b5f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:var(--ink)}header{padding:38px 20px 20px;max-width:1050px;margin:auto}.brandlogo{width:68px;height:68px;border-radius:17px;display:block;margin-bottom:12px;box-shadow:0 3px 15px #6e564322}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent);text-transform:uppercase}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,56px);margin:10px 0}header p{color:var(--muted);line-height:1.7}.toolbar{max-width:1050px;margin:auto;padding:0 20px 16px;display:flex;gap:10px;flex-wrap:wrap}.seasons{display:flex;gap:6px;background:#eae0d7;border-radius:16px;padding:5px}.seasons button,.btn{border:0;background:transparent;color:var(--ink);padding:11px 16px;border-radius:12px;font-size:14px;cursor:pointer}.seasons button.active{background:var(--paper);box-shadow:0 2px 8px #66504415}.btn{background:var(--paper);border:1px solid var(--line)}input[type=search]{min-width:170px;flex:1;border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--paper);font-size:14px;outline:none}.summary{max-width:1010px;margin:0 auto 20px;padding:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:13px}.grid{max-width:1050px;margin:auto;padding:0 20px 50px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:17px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 24px #6e56430a}.photo{height:210px;position:relative;background:linear-gradient(145deg,#eee3d7,#f9f5ee);display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:contain;padding:14px}.photo .placeholder{font-family:Georgia,serif;font-size:65px;color:#c7b5a6}.tag{position:absolute;top:10px;left:10px;font-size:10px;letter-spacing:.5px;padding:6px 9px;border-radius:30px;background:#fffdf9dd}.cardbody{padding:15px}.brand{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}.name{font-family:Georgia,serif;font-size:19px;margin:5px 0 7px;line-height:1.2}.notes{color:var(--muted);font-size:12px;line-height:1.55;min-height:38px}.reviewbox{margin:12px 0 10px;padding:11px 12px;border-radius:12px;background:#f3ebe3;border:1px solid #e9dcd0}.reviewlabel{font-size:11px;font-weight:700;letter-spacing:.4px;color:#806659;margin-bottom:5px}.reviewtext{font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;color:#463b36}.reviewempty{font-size:12px;color:#99867b;font-style:italic}.chips{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid var(--line);background:#fff;border-radius:30px;padding:5px 9px;font-size:11px;cursor:pointer;color:var(--muted)}.chip.selected{background:#776258;color:white;border-color:#776258}.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1;border:1px solid var(--line);border-radius:10px;background:white;padding:9px 4px;font-size:12px;cursor:pointer}.actions button.on{background:#e9e0d7;border-color:#d8c5b5}.actions button.edit{flex:0 0 43px}.modalback{position:fixed;inset:0;background:#29211c80;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modalback.show{display:flex}.modal{background:var(--paper);border-radius:22px;padding:24px;width:min(100%,480px);max-height:90vh;overflow:auto}.modal h2{font-family:Georgia,serif;font-weight:400}.field{display:block;margin:12px 0;font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid var(--line);background:white;font:inherit;color:var(--ink)}.field textarea{min-height:75px;resize:vertical}.modal .buttons{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.primary{background:#6f594f!important;color:white!important}.foot{max-width:1050px;margin:0 auto 35px;padding:0 20px;color:var(--muted);font-size:12px;line-height:1.6}.empty{text-align:center;grid-column:1/-1;padding:65px 15px;color:var(--muted)}@media(max-width:520px){header{padding-top:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 12px 40px}.photo{height:170px}.cardbody{padding:11px}.name{font-size:16px}.notes{font-size:11px}.seasons{width:100%;justify-content:space-between}.seasons button{flex:1;padding:11px 4px}.summary{padding:0 15px 8px}.toolbar{padding:0 12px 16px}.actions button{font-size:11px}}
</style></head><body><header><img class="brandlogo" src="/perfume-wardrobe/827EA6B6-5688-47B1-BDEC-E5B1109A1052.png" alt="Perfume Wardrobe logo"><div class="eyebrow">Personal fragrance journal</div><h1>My Perfume Wardrobe</h1><p>四季香水衣橱 · 按季节摆放、直接查看试香心得、珍藏喜欢的后调。<br>一瓶香水可以同时属于两个季节，所有修改自动保存在本机浏览器。</p></header><div class="toolbar"><div class="seasons" id="tabs"></div><input id="search" type="search" placeholder="搜索品牌、香水或香调…"><button class="btn" id="onlyDisplay">只看已摆出</button><button class="btn" id="add">＋ 添加香水</button><button class="btn" id="export">导出备份</button><label class="btn" style="cursor:pointer">导入备份<input id="import" type="file" accept="application/json" hidden></label></div><div class="summary"><span id="summary"></span><span>♡ 为喜欢的香水标记收藏</span></div><main class="grid" id="grid"></main><div class="foot">照片可在编辑中添加图片链接或上传自己的照片（仅保存在当前浏览器中）。已加入可核对的产品照片；图片无法加载时保留占位图。照片从品牌或零售商网站加载，可能受其网站访问策略影响。首次试香前的季节分类只是建议，可随时调整。建议定期导出 JSON 备份。</div><div class="modalback" id="modalback"><div class="modal"><h2 id="modalTitle">编辑香水</h2><form id="form"><label class="field">品牌<input name="brand" required></label><label class="field">香水名称<input name="name" required></label><label class="field">来源<select name="source"><option value="original">原有收藏</option><option value="harrods">Harrods 礼盒</option><option value="other">新添加</option></select></label><label class="field">香调 / 印象<textarea name="note" placeholder="例如：冷调雪松，衣服上留香6小时"></textarea></label><label class="field">个人试香记录<textarea name="review" placeholder="喜欢程度、甜度、留香、场合……"></textarea></label><label class="field">产品照片链接（可选）<input name="image" placeholder="https://..."></label><label class="field">或上传自己的照片<input type="file" id="upload" accept="image/*"></label><div class="field">适用季节<div id="seasonChecks" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px"></div></div><div class="buttons"><button type="button" class="btn" id="delete">删除</button><button type="button" class="btn" id="cancel">取消</button><button class="btn primary" type="submit">保存</button></div></form></div></div><script>
const OFFICIAL_IMAGES={"1":"https://cdn2.primor.eu/media/catalog/product/8/4/8435137743162_1_165a.jpg","2":"https://www.chanel.cn/images/t_one/t_fragrance/q_auto%3Agood%2Cf_auto%2Cfl_lossy%2Cdpr_1.1/w_1920/coco-mademoiselle-eau-de-parfum-spray-3-4fl-oz--packshot-default-116520-9564892495902.jpg","3":"https://img.myshopline.com/image/store/2004129914/1674805255704/3145891205251.jpg?h=2000&w=2000","4":"https://beautyhouse.com/cdn/shop/files/02s0cwdaq6_720x.png?v=1723895501","5":"https://latelierdesparfums.jp/cdn/shop/files/DG-DolceEDP-75mLwBox-2000x2000_1000x1000.jpg?v=1776931925","6":"https://www.atticadps.gr/images/h2160/1/jpg/files/products/842185115212/10.jpg","7":"https://cdn.mos.cms.futurecdn.net/QRGDMgFNti34FLzBaDLHHh-768-80.jpg","8":"https://asset.sephora.co.uk/img/prod/sku/769522/369113_media_swatch_07-08-25-23-55-57.jpg","9":"https://assets.hermes.com/is/image/hermesproduct/110435V0_front_wm_101?$product_default_bg$=","10":"https://hips.hearstapps.com/vader-prod.s3.amazonaws.com/product-images/7304cbde-64bf-478d-a81f-af9412bf0089/20126fa0-ad87-48aa-a343-05d7e925774b.jpeg?crop=1xw%3A1.0xh%3Bcenter%2Ctop&resize=980%3A%2A","11":"https://www.chanel.com/images/w_0.51%2Ch_0.51%2Cc_crop/q_auto%3Agood%2Cf_auto%2Cfl_lossy%2Cdpr_1.1/w_1920/n-5-eau-de-parfum-spray-3-4fl-oz--packshot-default-125530-9564912943134.jpg","12":"https://cdn.ludwigbeck.de/products/102052172/102052172-1.jpg?vh=9e9bd6","13":"https://uk.parfums-de-marly.com/cdn/shop/files/VALAYA_75ml_2_f70e3b27-5392-42a2-8861-eedb5e613f51.png?v=1741178620&width=1000","14":"https://www.jomalone.com.br/media/export/cms/products/1000x1000/jo_sku_L26L01_1000x1000_0.png","15":"https://ae.initioparfums.com/cdn/shop/files/BESTSELLERS_CTA.png?v=1774627439&width=1536","16":"https://emiratesfragrance.com/cdn/shop/files/Jeroboam-Gozo-For-Unisex-Extrait-De-Parfum-100ML.jpg?v=1736527303&width=650","17":"https://www.perfumelounge.eu/_next/image?q=75&url=https%3A%2F%2Fmedia.perfumelounge.eu%2Ffile%2Fperfumelounge%2Fperfumelounge%2Foriginal_images%2FBDK_-_Impadia_Eau_de_Parfum_10_ml_travel_spray_kiqm4hy.png&w=3840","18":"https://us.memoparis.com/cdn/shop/files/omnia-omnibus-ubique-eau-de-parfum-pale-pink-rectangular-798.jpg?v=1781710872&width=4600","19":"https://theparfums.com/cdn/shop/files/GOLDEN_MILK.png?v=1781577281&width=1946","20":"https://www.floraiku.com/cdn/shop/files/gong-50-10ml-floraiku-paris-655.webp?v=1744103759&width=2048","21":"https://cdn.ludwigbeck.de/products/102229302/102229302-1.jpg?vh=2e3217","22":"https://www.libertineparfumerie.com.au/cdn/shop/products/Patiala_1800x1800.png?v=1690345714","23":"https://hrd-live.cdn.scayle.cloud/images/bc9f89241a6dbdacab607fdade15673d.jpg?quality=75","24":"https://gharyal.com/cdn/shop/products/Parfums_de_Marly_DELINA_EXCLUSIF_-_75ml.jpg?v=1764577301","25":"https://www.myperfumeshop.co.uk/cdn/shop/files/iu_f5e9b082-f479-4876-bcd0-441a2a317fa5.png?v=1744883191&width=2048"};
const SEASONS=['春','夏','秋','冬'];const seed=[
['Prada','Infusion d’Iris EDP','original','清冷、干燥鸢尾',['春']],['Chanel','Coco Mademoiselle','original','经典花香西普',['春']],['Chanel','Gabrielle','original','明亮白花',['春','夏']],['Cartier','La Panthère','original','栀子花、经典脂粉',['春','秋']],['Dolce & Gabbana','Dolce EDP','original','清新白花；你的夏季主力',['夏']],['Le Labo','Another 13','original','贴肤麝香',['夏','秋']],['Maison Margiela Replica','Lazy Sunday Morning','original','柔和洁净',['春','夏']],['Maison Margiela Replica','Never-ending Summer','original','明亮柑橘',['夏']],['Hermès','Barénia EDP','original','现代西普',['秋']],['Le Labo','Thé Noir 29','original','深色茶香、木质',['秋','冬']],['Chanel','N°5','original','经典醛香脂粉',['秋','冬']],['Le Labo','Santal 33','original','干燥木质、皮革',['秋','冬']],['Parfums de Marly','Valaya','original','冬季核心；持久洁净麝香',['冬']],
['Jo Malone','English Pear & Freesia','harrods','清新花果；留香待测',['春','夏']],['Initio','Oud for Greatness','harrods','辛香乌木',['冬']],['Jeroboam','Gozo','harrods','浓郁花香麝香',['秋','冬']],['BDK','Impadia','harrods','玫瑰果香；留意甜度',['春']],['Memo Paris','Omnia Omnibus Ubique','harrods','温暖浓香，待试',['秋','冬']],['BORNTOSTANDOUT','Golden Milk','harrods','奶香辛香；偏甜风险',['冬']],['Floraïku','Gong','harrods','温暖香调；待试甜度',['秋']],['Amouage','Guidance','harrods','丰润花木；偏甜风险',['冬']],['Thameen','Patiala','harrods','丰润花香',['春','秋']],['Maison Francis Kurkdjian','Oud Velvet Mood','harrods','深沉乌木',['冬']],['Parfums de Marly','Delina Exclusif','harrods','浓郁玫瑰；偏甜风险',['冬','春']],['Ex Nihilo','Brompton Immortals','harrods','浓郁香型，待试',['秋','冬']]
];const KEY='perfume-wardrobe-v1';let items;try{items=JSON.parse(localStorage.getItem(KEY))||seed.map((a,i)=>({id:i+1,brand:a[0],name:a[1],source:a[2],note:a[3],seasons:a[4],review:'',image:'',favorite:false,displayed:{}}))}catch(e){items=seed.map((a,i)=>({id:i+1,brand:a[0],name:a[1],source:a[2],note:a[3],seasons:a[4],review:'',image:'',favorite:false,displayed:{}}))}let active='冬',onlyDisplay=false,editId=null,uploaded='';const $=id=>document.getElementById(id);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('存储空间不足，请尝试使用图片链接或导出备份。')}};const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){ $('tabs').innerHTML=SEASONS.map(s=>`<button class="${active===s?'active':''}" data-season="${s}">${s}</button>`).join('');const q=$('search').value.trim().toLowerCase();const filtered=items.filter(x=>x.seasons.includes(active)&&(!onlyDisplay||x.displayed?.[active])&&[x.brand,x.name,x.note,x.review].join(' ').toLowerCase().includes(q));$('summary').textContent=`${active}季 · ${filtered.length} 瓶 / ${items.filter(x=>x.seasons.includes(active)).length} 瓶 · 已摆出 ${items.filter(x=>x.seasons.includes(active)&&x.displayed?.[active]).length} 瓶`;$('onlyDisplay').classList.toggle('primary',onlyDisplay);$('grid').innerHTML=filtered.length?filtered.map(x=>`<article class="card"><div class="photo">${(x.image||OFFICIAL_IMAGES[x.id])?`<img src="${escapeHtml(x.image||OFFICIAL_IMAGES[x.id])}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="placeholder" style="display:none">♧</div>`:`<div class="placeholder">♧</div>`}<span class="tag">${x.source==='harrods'?'HARRODS':x.source==='original'?'COLLECTION':'NEW'}</span></div><div class="cardbody"><div class="brand">${escapeHtml(x.brand)}</div><div class="name">${escapeHtml(x.name)}</div><div class="notes">${escapeHtml(x.note||'尚无香调记录')}</div><div class="reviewbox"><div class="reviewlabel">✍ 我的试香记录</div>${x.review?.trim()?`<div class="reviewtext">${escapeHtml(x.review)}</div>`:`<div class="reviewempty">还没有记录 · 点击右下角 ✎ 添加</div>`}</div><div class="chips">${SEASONS.map(s=>`<button class="chip ${x.seasons.includes(s)?'selected':''}" data-toggle="${x.id}" data-s="${s}" title="点击加入或移出${s}季">${s}</button>`).join('')}</div><div class="actions"><button data-display="${x.id}" class="${x.displayed?.[active]?'on':''}">${x.displayed?.[active]?'✓ 已摆出':'○ 摆出来'}</button><button data-fav="${x.id}" class="${x.favorite?'on':''}">${x.favorite?'♥':'♡'}</button><button class="edit" data-edit="${x.id}">✎</button></div></div></article>`).join(''):'<div class="empty">这个季节暂时没有符合条件的香水。</div>'}
$('tabs').onclick=e=>{const s=e.target.dataset.season;if(s){active=s;render()}};$('search').oninput=render;$('onlyDisplay').onclick=()=>{onlyDisplay=!onlyDisplay;render()};$('grid').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=Number(b.dataset.toggle||b.dataset.display||b.dataset.fav||b.dataset.edit);const x=items.find(v=>v.id===id);if(!x)return;if(b.dataset.toggle){const s=b.dataset.s;x.seasons=x.seasons.includes(s)?x.seasons.filter(v=>v!==s):[...x.seasons,s];save();render()}else if(b.dataset.display){x.displayed??={};x.displayed[active]=!x.displayed[active];save();render()}else if(b.dataset.fav){x.favorite=!x.favorite;save();render()}else if(b.dataset.edit){openEditor(x)}};
function openEditor(x){editId=x?.id??null;uploaded='';$('modalTitle').textContent=x?'编辑香水':'添加香水';$('form').reset();for(const f of ['brand','name','source','note','review','image'])$('form').elements[f].value=x?.[f]|| (f==='source'?'other':'');$('seasonChecks').innerHTML=SEASONS.map(s=>`<label><input type="checkbox" value="${s}" ${x?.seasons?.includes(s)?'checked':''}> ${s}</label>`).join('');$('delete').style.display=x?'':'none';$('modalback').classList.add('show')};$('add').onclick=()=>openEditor(null);$('cancel').onclick=()=>$('modalback').classList.remove('show');$('modalback').onclick=e=>{if(e.target===$('modalback'))$('modalback').classList.remove('show')};$('upload').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1500000){alert('图片请先压缩到1.5MB以内，以免占满浏览器存储。');return}const r=new FileReader();r.onload=()=>uploaded=r.result;r.readAsDataURL(f)};$('form').onsubmit=e=>{e.preventDefault();const form=e.target;const data=Object.fromEntries(new FormData(form).entries());const seasons=[...$('seasonChecks').querySelectorAll('input:checked')].map(x=>x.value);if(!seasons.length){alert('请至少选择一个季节');return}const old=items.find(x=>x.id===editId);const entry={id:old?.id||Date.now(),brand:data.brand.trim(),name:data.name.trim(),source:data.source,note:data.note,review:data.review,image:uploaded||data.image,seasons,favorite:old?.favorite||false,displayed:old?.displayed||{}};if(old)items=items.map(x=>x.id===old.id?entry:x);else items.push(entry);save();$('modalback').classList.remove('show');render()};$('delete').onclick=()=>{if(confirm('确定删除这瓶香水吗？')){items=items.filter(x=>x.id!==editId);save();$('modalback').classList.remove('show');render()}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,items},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-perfume-wardrobe.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.items))throw Error('无效格式');if(!confirm('导入会覆盖当前衣橱，确定吗？'))return;items=data.items;save();render()}catch(err){alert('无法读取备份文件')}e.target.value=''};render();
</script></body></html>
